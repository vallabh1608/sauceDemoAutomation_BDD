# Extent Reports Cucumber 7 Adapter Configuration

# 1. Start the Spark Reporter (CRITICAL FOR CUCUMBER 7)
extent.reporter.spark.start=true
extent.reporter.spark.out=reports/extent-report.html

# 2. Report Theme (Options: standard or dark)
extent.reporter.spark.theme=dark

# 3. Report Title and Name
extent.reporter.spark.reportName=SauceDemo Automation Test Report
extent.reporter.spark.documentTitle=SauceDemo BDD Cucumber Test Suite

# 4. Attachments & Offline Viewing
extent.reporter.spark.cache=true